    const byId = (id) => document.getElementById(id);
    const quizRoot = byId('quiz');
    const statusBox = byId('status');
    const resultsBox = byId('results');
    const reviewBox = byId('review');

    function allItems() {
      const items = [];
      QUIZ.sections.forEach(section => {
        if (section.items) section.items.forEach(item => items.push({...item, sectionId: section.id, sectionTitle: section.title}));
        if (section.passages) section.passages.forEach(p => p.items.forEach(item => items.push({...item, sectionId: section.id, sectionTitle: section.title})));
      });
      return items;
    }

    let MEMORY_HISTORY = [];

    function readHistorySafe() {
      try {
        return JSON.parse(localStorage.getItem(QUIZ.storageKey) || '[]');
      } catch (error) {
        return MEMORY_HISTORY;
      }
    }

    function writeHistorySafe(history) {
      MEMORY_HISTORY = history;
      try {
        localStorage.setItem(QUIZ.storageKey, JSON.stringify(history));
      } catch (error) {
        // localStorage can be unavailable in some preview or test contexts.
      }
    }

    function clearHistorySafe() {
      MEMORY_HISTORY = [];
      try {
        localStorage.removeItem(QUIZ.storageKey);
      } catch (error) {
        // localStorage can be unavailable in some preview or test contexts.
      }
    }

    function formatScore(n) {
      const rounded = Math.round((n + Number.EPSILON) * 10) / 10;
      return Math.abs(rounded - Math.round(rounded)) < 0.0001 ? String(Math.round(rounded)) : rounded.toFixed(1);
    }

    function normalizeText(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[’‘`]/g, "'")
        .replace(/can\s*not/g, 'cant')
        .replace(/can['’]?t/g, 'cant')
        .replace(/should\s*not/g, 'shouldnt')
        .replace(/should['’]?t/g, 'shouldnt')
        .replace(/[.?!,;:'。？！，]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function renderTextItem(item, index) {
      return `<div class="question-card" data-qid="${item.id}">
        <label for="${item.id}"><span class="q-label">${index}.</span>${item.prompt}</label><br>
        <input id="${item.id}" name="${item.id}" type="text" autocomplete="off" aria-label="Answer for ${item.id}">
      </div>`;
    }

    function renderBlankItem(item, index) {
      return `<div class="question-card" data-qid="${item.id}">
        <label class="blank-line" for="${item.id}"><span class="q-label">${index}.</span><span>${escapeHtml(item.before)}</span>
        <input id="${item.id}" name="${item.id}" type="text" autocomplete="off" aria-label="Blank ${index}">
        <span>${escapeHtml(item.after)}</span></label>
      </div>`;
    }

    function renderMcqItem(item, index) {
      const options = item.options.map((opt, optIndex) => `
        <label class="option">
          <input type="radio" name="${item.id}" value="${escapeHtml(opt)}" aria-label="${item.id} option ${String.fromCharCode(65 + optIndex)}">
          <span><strong>(${String.fromCharCode(65 + optIndex)})</strong> ${escapeHtml(opt)}</span>
        </label>`).join('');
      return `<div class="question-card" data-qid="${item.id}">
        <p><span class="q-label">${index}.</span>${item.prompt}</p>
        <div class="options" role="radiogroup" aria-label="Question ${item.id}">${options}</div>
      </div>`;
    }

    function renderQuiz() {
      let html = '';
      QUIZ.sections.forEach(section => {
        html += `<section id="section-${section.id}"><div class="section-head"><h2>${section.title}</h2><span class="points">${section.pointsLabel}</span></div><p class="instructions">${section.instructions}</p>`;
        if (section.items) {
          section.items.forEach((item, idx) => {
            if (section.id === 'C') html += renderBlankItem(item, idx + 1);
            else if (item.type === 'text') html += renderTextItem(item, idx + 1);
            else html += renderMcqItem(item, idx + 1);
          });
        }
        if (section.passages) {
          let globalIndex = 1;
          section.passages.forEach(passage => {
            html += `<article class="passage"><h3>${escapeHtml(passage.title)}</h3><p>${escapeHtml(passage.text)}</p></article>`;
            passage.items.forEach(item => { html += renderMcqItem(item, globalIndex++); });
          });
        }
        html += '</section>';
      });
      quizRoot.innerHTML = html;
    }

    function getAnswer(item) {
      if (item.type === 'mcq') {
        const chosen = document.querySelector(`input[name="${item.id}"]:checked`);
        return chosen ? chosen.value : '';
      }
      const input = byId(item.id);
      return input ? input.value : '';
    }

    function isCorrect(item, answer) {
      if (item.type === 'mcq') return answer === item.answer;
      const normalized = normalizeText(answer);
      return item.accepted.map(normalizeText).includes(normalized);
    }

    function setStatus(message, kind) {
      statusBox.className = `show ${kind}`;
      statusBox.textContent = message;
    }

    function clearStatus() {
      statusBox.className = '';
      statusBox.textContent = '';
    }

    function gradeQuiz() {
      const items = allItems();
      document.querySelectorAll('.question-card').forEach(card => card.classList.remove('missing'));
      const missing = items.filter(item => String(getAnswer(item)).trim() === '');
      if (missing.length) {
        missing.forEach(item => {
          const card = document.querySelector(`[data-qid="${item.id}"]`);
          if (card) card.classList.add('missing');
        });
        setStatus(`還有 ${missing.length} 個作答欄位未完成。請完成黃色標示的題目後再提交。`, 'warn');
        const first = document.querySelector('.question-card.missing');
        if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
        return null;
      }

      let total = 0;
      const sectionScores = Object.fromEntries(QUIZ.sections.map(s => [s.id, {score: 0, max: s.total, title: s.title}]));
      const review = [];
      items.forEach(item => {
        const userAnswer = getAnswer(item);
        const correct = isCorrect(item, userAnswer);
        if (correct) {
          total += item.points;
          sectionScores[item.sectionId].score += item.points;
        } else {
          review.push({...item, userAnswer});
        }
      });
      // Force exact total when all answers are correct to avoid tiny floating point errors.
      if (review.length === 0) total = QUIZ.maxScore;
      return { total, sectionScores, review };
    }

    function renderResults(result) {
      const percent = Math.round((result.total / QUIZ.maxScore) * 100);
      const rows = QUIZ.sections.map(s => `<tr><td>${s.id}</td><td>${s.title}</td><td>${formatScore(result.sectionScores[s.id].score)} / ${s.total}</td></tr>`).join('');
      resultsBox.hidden = false;
      resultsBox.innerHTML = `<h2>成績結果</h2><p class="score-big">${formatScore(result.total)} / ${QUIZ.maxScore}</p><p>得分率：${percent}%</p><table class="breakdown"><thead><tr><th>部分</th><th>題型</th><th>分數</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderReview(result) {
      reviewBox.hidden = false;
      if (result.review.length === 0) {
        reviewBox.innerHTML = `<h2>錯題檢討</h2><p><span class="tag ok">全部答對</span> 很好，所有答案都正確。</p>`;
        return;
      }
      const items = result.review.map(item => `
        <div class="review-item">
          <p><span class="tag bad">${item.id}</span> <strong>${item.sectionTitle}</strong></p>
          <p><strong>你的答案：</strong>${escapeHtml(item.userAnswer || '未作答')}</p>
          <p><strong>正確答案：</strong>${escapeHtml(item.answer)}</p>
          <p><strong>提示：</strong>${escapeHtml(item.explanation)}</p>
        </div>`).join('');
      reviewBox.innerHTML = `<h2>錯題檢討</h2><p>以下是需要修正的題目。</p>${items}`;
    }

    function saveHistory(result) {
      const history = readHistorySafe();
      history.unshift({
        date: new Date().toLocaleString('zh-Hant-TW'),
        score: formatScore(result.total),
        max: QUIZ.maxScore,
        sections: Object.fromEntries(Object.entries(result.sectionScores).map(([k, v]) => [k, formatScore(v.score)]))
      });
      writeHistorySafe(history.slice(0, 10));
      renderHistory();
    }

    function renderHistory() {
      const history = readHistorySafe();
      const target = byId('historyList');
      if (!history.length) {
        target.innerHTML = '<p class="small">目前沒有成績紀錄。</p>';
        return;
      }
      target.innerHTML = `<ol class="history-list">${history.map(h => `<li><strong>${h.score} / ${h.max}</strong>｜${escapeHtml(h.date)}｜A:${h.sections.A} B:${h.sections.B} C:${h.sections.C} D:${h.sections.D} E:${h.sections.E}</li>`).join('')}</ol>`;
    }

    function resetQuiz() {
      allItems().forEach(item => {
        if (item.type === 'mcq') document.querySelectorAll(`input[name="${item.id}"]`).forEach(input => input.checked = false);
        else { const input = byId(item.id); if (input) input.value = ''; }
      });
      document.querySelectorAll('.question-card').forEach(card => card.classList.remove('missing'));
      clearStatus();
      resultsBox.hidden = true;
      reviewBox.hidden = true;
      resultsBox.innerHTML = '';
      reviewBox.innerHTML = '';
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function clearHistory() {
      clearHistorySafe();
      renderHistory();
      setStatus('已清除這份測驗的本機成績紀錄。', 'ok');
    }

    byId('submitBtn').addEventListener('click', () => {
      const result = gradeQuiz();
      if (!result) return;
      renderResults(result);
      renderReview(result);
      saveHistory(result);
      setStatus(`已完成批改：${formatScore(result.total)} / ${QUIZ.maxScore}。`, result.total === QUIZ.maxScore ? 'ok' : 'bad');
      resultsBox.scrollIntoView({behavior:'smooth', block:'start'});
    });
    byId('retryBtn').addEventListener('click', resetQuiz);
    byId('clearHistoryBtn').addEventListener('click', clearHistory);

    renderQuiz();
    renderHistory();
  </script>
