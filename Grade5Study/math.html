<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學測驗索引</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .unit-section {
            margin-bottom: 32px;
        }
        .unit-section h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 16px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent-primary);
        }
        .unit-quiz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .quiz-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 22px;
            backdrop-filter: blur(8px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .quiz-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow);
            border-color: var(--accent-primary);
        }
        .quiz-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .quiz-label {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
        }
        .quiz-type-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 99px;
            width: fit-content;
        }
        .quiz-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 99px;
            white-space: nowrap;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }
        .quiz-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            opacity: 0.9;
        }
    </style>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            btn.innerHTML = newTheme === 'dark' ? '<span>☀️</span> 亮色模式' : '<span>🌙</span> 暗色模式';
            localStorage.setItem('theme', newTheme);
        }

        window.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const btn = document.getElementById('themeBtn');
            if (savedTheme === 'dark') btn.innerHTML = '<span>☀️</span> 亮色模式';
        });
    </script>
</head>
<body>

<div class="theme-toggle">
    <button id="themeBtn" onclick="toggleTheme()"><span>🌙</span> 暗色模式</button>
</div>

<div class="container">
    <h1>🔢 數學測驗目錄</h1>

    <div class="unit-section">
        <h2>五年級下學期</h2>
        <div class="unit-quiz-list">
            <div class="quiz-item">
                <div class="quiz-info">
                    <span class="quiz-label">第九單元：容積和容量</span>
                    <span class="quiz-type-badge">互動練習卷</span>
                </div>
                <a href="math_u9_quiz1.html" class="quiz-btn">前往作答 →</a>
            </div>
        </div>
    </div>

    <p><a href="index.html" style="text-decoration: none; font-weight: bold; color: var(--accent-primary);">⬅ 回到首頁</a></p>
</div>
</body>
</html>
