<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>English G5 Unit 10 互動複習測驗</title>
  <style>
    :root {
      --ink: #243047;
      --muted: #667085;
      --paper: #fffdf8;
      --purple: #7254b3;
      --purple-dark: #533890;
      --purple-soft: #f1ebff;
      --teal: #168a87;
      --teal-soft: #e8f8f6;
      --gold: #f2ad3d;
      --gold-soft: #fff5dc;
      --red: #c6414a;
      --red-soft: #fff0f1;
      --green: #25855a;
      --green-soft: #eaf8f0;
      --line: #d9d7e3;
      --shadow: 0 10px 30px rgba(46, 36, 75, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(114, 84, 179, .14), transparent 26rem),
        radial-gradient(circle at 90% 12%, rgba(22, 138, 135, .13), transparent 24rem),
        #f6f3fb;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      line-height: 1.65;
    }

    button, input, select { font: inherit; }

    button { touch-action: manipulation; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px max(16px, calc((100vw - 1120px) / 2));
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid rgba(114, 84, 179, .16);
      backdrop-filter: blur(12px);
    }

    .progress-track {
      flex: 1;
      height: 10px;
      overflow: hidden;
      background: #ebe8f1;
      border-radius: 999px;
    }

    #progressBar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--teal));
      transition: width .25s ease;
    }

    #progressText {
      min-width: 95px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 800;
      text-align: right;
    }

    .page-shell {
      width: min(1120px, calc(100% - 28px));
      margin: 26px auto 70px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      padding: 9px 14px;
      color: var(--purple-dark);
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(114, 84, 179, .22);
      border-radius: 11px;
      box-shadow: var(--shadow);
      font-weight: 900;
      text-decoration: none;
    }

    .back-link:hover {
      color: white;
      background: var(--purple);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(26px, 5vw, 54px);
      color: white;
      background: linear-gradient(135deg, #5a3a98 0%, #7659b6 52%, #168a87 100%);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -90px;
      bottom: -120px;
      width: 360px;
      height: 360px;
      background:
        linear-gradient(145deg, transparent 44%, rgba(255,255,255,.16) 45% 55%, transparent 56%),
        linear-gradient(35deg, transparent 44%, rgba(255,255,255,.09) 45% 55%, transparent 56%);
      transform: rotate(8deg);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #e8defe;
      font-size: .85rem;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 1.06;
      letter-spacing: -.035em;
    }

    .hero p {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 18px 0 0;
      color: #f6f1ff;
      font-size: 1.04rem;
    }

    .hero-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .meta-chip {
      padding: 7px 12px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      font-size: .9rem;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 24px;
      align-items: start;
      margin-top: 24px;
    }

    .sidebar {
      position: sticky;
      top: 62px;
      display: grid;
      gap: 16px;
    }

    .panel, .quiz-section {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(100, 84, 135, .14);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel { padding: 19px; }

    .panel h2, .panel h3 { margin: 0 0 12px; }

    .section-nav {
      display: grid;
      gap: 8px;
    }

    .section-nav a {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      color: var(--ink);
      text-decoration: none;
      border-radius: 10px;
      transition: background .15s ease, color .15s ease;
    }

    .section-nav a:hover {
      color: var(--purple-dark);
      background: var(--purple-soft);
    }

    .section-nav small { color: var(--muted); }

    .history-empty {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .history-list {
      display: grid;
      gap: 9px;
      max-height: 310px;
      overflow: auto;
    }

    .history-item {
      padding: 10px;
      background: #faf9fd;
      border: 1px solid #e8e4f0;
      border-radius: 10px;
    }

    .history-item strong {
      color: var(--purple-dark);
      font-size: 1.05rem;
    }

    .history-item time {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .78rem;
    }

    .quiz-sections {
      display: grid;
      gap: 22px;
    }

    .quiz-section {
      scroll-margin-top: 70px;
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 22px;
      background: linear-gradient(90deg, var(--purple-soft), #fff);
      border-bottom: 1px solid #e5e0ee;
    }

    .section-letter {
      display: grid;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      place-items: center;
      color: white;
      background: var(--purple);
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.16rem, 2.2vw, 1.45rem);
      line-height: 1.25;
    }

    .section-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .section-content { padding: 6px 22px 22px; }

    .section-instruction {
      margin: 15px 0;
      padding: 11px 14px;
      color: #644a1d;
      background: var(--gold-soft);
      border-left: 5px solid var(--gold);
      border-radius: 9px;
      font-size: .93rem;
    }

    .question {
      position: relative;
      margin-top: 14px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid #e4e0da;
      border-radius: 14px;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .question.unanswered {
      background: #fff8f8;
      border: 2px solid var(--red);
      animation: nudge .25s ease 2;
    }

    .question.correct {
      border-color: #9bd1b4;
      background: #fbfffc;
    }

    .question.incorrect {
      border-color: #e4a5aa;
      background: #fffafa;
    }

    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }

    .q-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .q-number {
      display: grid;
      flex: 0 0 auto;
      width: 31px;
      height: 31px;
      place-items: center;
      color: white;
      background: var(--teal);
      border-radius: 9px;
      font-size: .88rem;
      font-weight: 900;
    }

    .q-prompt {
      flex: 1;
      margin: 1px 0 0;
      font-family: Arial, sans-serif;
      font-size: 1.02rem;
      line-height: 1.55;
    }

    .points {
      color: var(--muted);
      font-size: .78rem;
      white-space: nowrap;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin: 14px 0 0 41px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 10px 12px;
      background: white;
      border: 1px solid #ded9e8;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .option:hover {
      background: var(--purple-soft);
      border-color: #b7a4dc;
      transform: translateY(-1px);
    }

    .option input {
      margin-top: 4px;
      accent-color: var(--purple);
    }

    .option span { font-family: Arial, sans-serif; }

    .text-answer {
      width: calc(100% - 41px);
      margin: 14px 0 0 41px;
      padding: 11px 13px;
      color: var(--ink);
      background: white;
      border: 2px solid #d8d3e2;
      border-radius: 10px;
      outline: none;
    }

    .text-answer:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(114, 84, 179, .12);
    }

    .listen-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 13px 0 0 41px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 15px;
      color: white;
      background: var(--purple);
      border: 0;
      border-radius: 11px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn.secondary { color: var(--purple-dark); background: var(--purple-soft); }
    .btn.teal { background: var(--teal); }
    .btn.danger { color: var(--red); background: var(--red-soft); }
    .btn.large { min-height: 52px; padding: 13px 23px; font-size: 1.05rem; }

    .listen-status {
      color: var(--muted);
      font-size: .84rem;
    }

    .visual-wrap {
      margin: 15px 0;
      overflow-x: auto;
    }

    .visual-card {
      min-width: 600px;
      padding: 12px;
      background: #f8fbfb;
      border: 1px solid #cfe4e2;
      border-radius: 14px;
    }

    .visual-card svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .process-card {
      padding: 10px;
      text-align: center;
      background: #fff;
      border: 1px solid #d9e6e4;
      border-radius: 13px;
    }

    .process-card svg {
      width: 100%;
      max-height: 150px;
    }

    .process-card label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      font-weight: 900;
    }

    .process-card select {
      min-width: 72px;
      padding: 7px;
      background: white;
      border: 2px solid #cfc8dc;
      border-radius: 8px;
    }

    .steps {
      margin: 14px 0 0;
      padding: 13px 13px 13px 36px;
      background: var(--teal-soft);
      border-radius: 12px;
      font-family: Arial, sans-serif;
    }

    .reading {
      margin: 15px 0;
      padding: 20px;
      background: #fffdf5;
      border: 1px solid #ebdfbb;
      border-radius: 14px;
      font-family: Arial, sans-serif;
    }

    .reading h3 {
      margin: 0 0 10px;
      text-align: center;
    }

    .reading p { margin: 10px 0; }

    .submit-area {
      margin-top: 26px;
      padding: 23px;
      text-align: center;
      background: white;
      border: 1px solid rgba(100, 84, 135, .14);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .submit-area p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .alert {
      display: none;
      margin: 18px 0 0;
      padding: 13px 16px;
      border-radius: 11px;
      font-weight: 800;
    }

    .alert.show { display: block; }
    .alert.error { color: #7c222a; background: var(--red-soft); border: 1px solid #edbbc0; }
    .alert.success { color: #195e40; background: var(--green-soft); border: 1px solid #b5ddc7; }

    #resultPanel {
      display: none;
      margin-top: 24px;
      overflow: hidden;
    }

    #resultPanel.show { display: block; }

    .score-hero {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 24px;
      align-items: center;
      padding: 25px;
      color: white;
      background: linear-gradient(135deg, var(--purple-dark), var(--teal));
    }

    .score-ring {
      display: grid;
      width: 155px;
      height: 155px;
      place-items: center;
      margin: auto;
      background: rgba(255,255,255,.12);
      border: 9px solid rgba(255,255,255,.82);
      border-radius: 50%;
    }

    .score-ring strong {
      display: block;
      font-size: 2.5rem;
      line-height: 1;
    }

    .score-ring small { display: block; text-align: center; }
    .score-copy h2 { margin: 0 0 7px; }
    .score-copy p { margin: 0; color: #eefdfb; }

    .breakdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .breakdown-item {
      padding: 12px;
      text-align: center;
      background: #f8f6fc;
      border-radius: 11px;
    }

    .breakdown-item strong {
      display: block;
      color: var(--purple-dark);
      font-size: 1.12rem;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 0 20px 22px;
    }

    #reviewPanel {
      display: none;
      padding: 0 20px 22px;
    }

    #reviewPanel.show { display: block; }

    .review-item {
      margin-top: 12px;
      padding: 16px;
      background: #fff9f9;
      border: 1px solid #edc3c6;
      border-radius: 12px;
    }

    .review-item h4 {
      margin: 0 0 8px;
      color: #8d2b34;
    }

    .review-item p { margin: 6px 0; }
    .review-label { font-weight: 900; }

    .explanation {
      margin-top: 10px !important;
      padding: 10px 12px;
      color: #443367;
      background: var(--purple-soft);
      border-radius: 9px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; grid-template-columns: 1fr 1fr; order: -1; }
      .section-nav { grid-template-columns: repeat(2, 1fr); }
      .breakdown { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 650px) {
      .page-shell { width: min(100% - 16px, 1120px); margin-top: 12px; }
      .hero { padding: 28px 20px; border-radius: 20px; }
      .layout { gap: 14px; }
      .sidebar { grid-template-columns: 1fr; }
      .section-nav { grid-template-columns: 1fr 1fr; font-size: .9rem; }
      .section-head { padding: 16px; }
      .section-content { padding: 4px 12px 15px; }
      .question { padding: 14px 12px; }
      .options { grid-template-columns: 1fr; margin-left: 0; }
      .text-answer, .listen-row { width: 100%; margin-left: 0; }
      .process-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .score-hero { grid-template-columns: 1fr; text-align: center; }
      .score-ring { width: 130px; height: 130px; }
    }

    @media (max-width: 410px) {
      .process-grid, .section-nav, .breakdown { grid-template-columns: 1fr; }
      .topbar { gap: 8px; }
      #progressText { min-width: 78px; font-size: .78rem; }
    }

    @media print {
      .topbar, .sidebar, .listen-row, .submit-area, #resultPanel { display: none !important; }
      body { background: white; }
      .page-shell { width: 100%; margin: 0; }
      .hero { color: black; background: white; box-shadow: none; border: 2px solid #333; }
      .hero p, .eyebrow { color: #333; }
      .layout { display: block; }
      .quiz-section { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="topbar" aria-label="作答進度">
    <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
    <div id="progressText">已完成 0 / 43</div>
  </div>

  <main class="page-shell">
    <a class="back-link" href="english.html">⬅ 回到英文測驗目錄</a>
    <header class="hero">
      <p class="eyebrow">New Mastery · Grade 5 · Unit 10</p>
      <h1>English G5 Unit 10<br>互動複習測驗</h1>
      <p>請仔細閱讀或聆聽每一題。題目著重字彙運用、some-/any- 文法、位置描述、程序理解與閱讀推論。</p>
      <div class="hero-meta">
        <span class="meta-chip">7 大題</span>
        <span class="meta-chip">43 小題</span>
        <span class="meta-chip">總分 100 分</span>
        <span class="meta-chip">建議時間 45–55 分鐘</span>
      </div>
    </header>

    <div class="layout">
      <section class="quiz-sections" id="quizForm" aria-label="Unit 10 quiz"></section>

      <aside class="sidebar">
        <section class="panel">
          <h2>測驗導覽</h2>
          <nav class="section-nav" id="sectionNav"></nav>
        </section>
        <section class="panel">
          <h3>歷史成績</h3>
          <div id="historyList"></div>
          <button type="button" class="btn danger" id="clearHistoryBtn" style="width:100%; margin-top:12px;">清除歷史紀錄</button>
        </section>
      </aside>
    </div>

    <section class="submit-area">
      <p>完成全部 43 題後再送出。送出後可查看分項成績與錯題解析。</p>
      <button type="button" class="btn teal large" id="submitBtn">送出答案並計分</button>
      <div class="alert" id="formAlert" role="alert" aria-live="polite"></div>
    </section>

    <section class="panel" id="resultPanel" aria-live="polite">
      <div class="score-hero">
        <div class="score-ring">
          <div><strong id="scoreValue">0</strong><small>/ 100</small></div>
        </div>
        <div class="score-copy">
          <h2 id="scoreTitle">測驗完成</h2>
          <p id="scoreMessage"></p>
        </div>
      </div>
      <div class="breakdown" id="breakdown"></div>
      <div class="result-actions">
        <button type="button" class="btn secondary" id="toggleReviewBtn">查看錯題解析</button>
        <button type="button" class="btn" id="retryBtn">重新作答</button>
      </div>
      <div id="reviewPanel"></div>
    </section>
  </main>

  <script>
    "use strict";

    const HISTORY_KEY = "nmG5Unit10QuizHistory";

    const sections = [
      {
        id: "A",
        title: "Listen and Choose",
        subtitle: "Listen carefully and choose the best answer.",
        instruction: "按下「播放題目」聆聽英文，每題可重播。畫面只顯示選項，不顯示朗讀稿。",
        points: 10,
        questions: [
          {
            type: "listening", points: 2,
            prompt: "Choose the best response.",
            speech: "I don't understand this word. What should I do?",
            options: ["Look it up in a dictionary.", "Put it outside.", "Go downstairs.", "Buy a train ticket."],
            answer: 0,
            explanation: "當對方不懂單字時，合理回應是查字典。look it up 意思是「查閱它」。Example: Look the word up in a dictionary."
          },
          {
            type: "listening", points: 2,
            prompt: "Choose the sentence that matches what you hear.",
            speech: "The girl is explaining how to make a cheese sandwich.",
            options: ["She is asking for a dictionary.", "She is giving instructions.", "She is buying something.", "She is looking for someone."],
            answer: 1,
            explanation: "explaining how to... 表示正在說明做事步驟，也就是 giving instructions。"
          },
          {
            type: "listening", points: 2,
            prompt: "Choose the best answer.",
            speech: "Did you see anyone in the classroom this morning?",
            options: ["Yes, I saw someone near the window.", "Yes, I went somewhere.", "No, I didn't see anything to eat.", "No, it isn't upstairs."],
            answer: 0,
            explanation: "問題用 anyone 詢問「任何人」，肯定回答可用 someone 表示「某人」。"
          },
          {
            type: "listening", points: 2,
            prompt: "Choose the best answer.",
            speech: "Where did Kevin put the travel brochure?",
            options: ["He explained it clearly.", "It means a small book.", "He put it inside his backpack.", "He saw someone yesterday."],
            answer: 2,
            explanation: "Where 詢問地點，回答要提供位置；inside his backpack 是符合問題的地點資訊。"
          },
          {
            type: "listening", points: 2,

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[’']/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

        const article = document.createElement("article");
        article.className = "quiz-section";
        article.id = `section-${section.id}`;
        article.innerHTML = `
          <div class="section-head">
            <div class="section-letter">${section.id}</div>
            <div>
              <h2>${section.title}</h2>
              <p>${section.subtitle}（${section.points} 分）</p>
            </div>
          </div>
          <div class="section-content">
            <div class="section-instruction">${section.instruction}</div>
            ${section.process ? `<ol class="steps">${section.steps.map(s => `<li>${s}</li>`).join("")}</ol>` : ""}
            ${section.house ? houseSvg() : ""}
            ${section.reading ? `<div class="reading">${section.reading}</div>` : ""}
            <div class="questions-holder"></div>
          </div>`;

        const holder = article.querySelector(".questions-holder");
        if (section.process) {
          holder.className = "questions-holder process-grid";
        }
        section.questions.forEach((question, index) => {
          holder.appendChild(renderQuestion(section, question, index));
        });
        form.appendChild(article);
      });
    }

    function renderQuestion(section, question, index) {
      const key = `${section.id}${index + 1}`;
      const wrapper = document.createElement("div");
      wrapper.className = question.type === "process" ? "process-card question" : "question";
      wrapper.dataset.key = key;
      wrapper.dataset.section = section.id;

      if (question.type === "process") {
        wrapper.innerHTML = `
          ${svgIcons[question.picture]}
          <label for="${key}">圖片 ${index + 1}
            <select id="${key}" name="${key}" aria-label="圖片 ${index + 1} 的步驟編號">
              <option value="">--</option>
              ${[1,2,3,4,5,6].map(n => `<option value="${n}">${n}</option>`).join("")}
            </select>
          </label>`;
        return wrapper;
      }

      wrapper.innerHTML = `
        <div class="q-top">
          <span class="q-number">${index + 1}</span>
          <p class="q-prompt">${question.prompt}</p>
          <span class="points">${question.points} 分</span>
        </div>`;

      if (question.type === "choice" || question.type === "listening") {
        if (question.type === "listening") {
          const listen = document.createElement("div");
          listen.className = "listen-row";
          listen.innerHTML = `
            <button type="button" class="btn listen-btn" data-speech="${escapeAttribute(question.speech)}">🔊 播放題目</button>
            <span class="listen-status" aria-live="polite">尚未播放</span>`;
          wrapper.appendChild(listen);
        }
        const options = document.createElement("div");
        options.className = "options";
        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          label.innerHTML = `
            <input type="radio" name="${key}" value="${optionIndex}">
            <span>${String.fromCharCode(65 + optionIndex)}. ${option}</span>`;
          options.appendChild(label);
        });
        wrapper.appendChild(options);
      } else if (question.type === "text") {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "text-answer";
        input.name = key;
        input.id = key;
        input.autocomplete = "off";
        input.spellcheck = false;
        input.placeholder = section.id === "B" ? "Type the whole word." : "Write a complete sentence.";
        input.setAttribute("aria-label", `第 ${index + 1} 題答案`);
        wrapper.appendChild(input);
      }
      return wrapper;
    }

    function escapeAttribute(text) {
      return text.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    function getAnswer(section, question, index) {
      const key = `${section.id}${index + 1}`;
      if (question.type === "choice" || question.type === "listening") {
        const selected = document.querySelector(`input[name="${key}"]:checked`);
        return selected ? selected.value : "";
      }
      const field = document.querySelector(`[name="${key}"]`);
      return field ? field.value.trim() : "";
    }

    function isCorrect(question, value) {
      if (question.type === "choice" || question.type === "listening") {
        return Number(value) === question.answer;
      }
      if (question.type === "process") {
        return String(value) === String(question.answer);
      }
      const normalized = normalize(value);
      return question.answers.some(answer => normalize(answer) === normalized);
    }

    function getDisplayAnswer(question) {
      if (question.type === "choice" || question.type === "listening") {
        return `${String.fromCharCode(65 + question.answer)}. ${question.options[question.answer]}`;
      }
      if (question.type === "process") return `Step ${question.answer}`;
      return question.displayAnswer;
    }

    function getDisplayUserAnswer(question, value) {
      if (!value) return "未作答";
      if (question.type === "choice" || question.type === "listening") {
        const i = Number(value);
        return `${String.fromCharCode(65 + i)}. ${question.options[i]}`;
      }
      if (question.type === "process") return `Step ${value}`;
      return value;
    }

    function allQuestionEntries() {
      return sections.flatMap(section =>
        section.questions.map((question, index) => ({ section, question, index }))
      );
    }

    function updateProgress() {
      const entries = allQuestionEntries();
      const complete = entries.filter(({section, question, index}) =>
        getAnswer(section, question, index) !== ""
      ).length;
      document.getElementById("progressBar").style.width = `${(complete / entries.length) * 100}%`;
      document.getElementById("progressText").textContent = `已完成 ${complete} / ${entries.length}`;
    }

    function showAlert(message, type) {
      const alert = document.getElementById("formAlert");
      alert.textContent = message;
      alert.className = `alert show ${type}`;
    }

    function clearAlert() {
      const alert = document.getElementById("formAlert");
      alert.textContent = "";
      alert.className = "alert";
    }

    function submitQuiz() {
      clearAlert();
      document.querySelectorAll(".question").forEach(el => el.classList.remove("unanswered"));

      const entries = allQuestionEntries();
      const unanswered = entries.filter(({section, question, index}) =>
        getAnswer(section, question, index) === ""
      );

      if (unanswered.length) {
        unanswered.forEach(({section, index}) => {
          document.querySelector(`[data-key="${section.id}${index + 1}"]`).classList.add("unanswered");
        });
        showAlert(`還有 ${unanswered.length} 題尚未完成。紅色框線已標出未作答題目。`, "error");
        const first = document.querySelector(".question.unanswered");
        if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      let total = 0;
      const breakdown = {};
      const incorrect = [];

      sections.forEach(section => {
        breakdown[section.id] = { earned: 0, possible: section.points, title: section.title };
        section.questions.forEach((question, index) => {
          const value = getAnswer(section, question, index);
          const correct = isCorrect(question, value);
          const element = document.querySelector(`[data-key="${section.id}${index + 1}"]`);
          element.classList.remove("correct", "incorrect");
          element.classList.add(correct ? "correct" : "incorrect");
          if (correct) {
            total += question.points;
            breakdown[section.id].earned += question.points;
          } else {
            incorrect.push({ section, question, index, value });
          }
        });
      });

      showResults(total, breakdown, incorrect);
      saveHistory(total, breakdown);
      renderHistory();
      lockQuiz(true);
      showAlert("已完成計分！你可以在下方查看分數與錯題解析。", "success");
      document.getElementById("resultPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function showResults(total, breakdown, incorrect) {
      const percentage = total;
      document.getElementById("scoreValue").textContent = total;
      document.getElementById("scoreTitle").textContent =
        percentage >= 90 ? "太棒了，掌握得很穩！" :
        percentage >= 75 ? "做得不錯，再修正幾個觀念！" :
        percentage >= 60 ? "已有基礎，錯題值得再練一次。" :
        "先別急，從解析中把規則一個個撿回來。";
      document.getElementById("scoreMessage").textContent =
        `答對得分 ${total} 分，錯誤 ${incorrect.length} 題。錯題解析會說明每題使用的文法或語意線索。`;

      document.getElementById("breakdown").innerHTML = Object.entries(breakdown).map(([id, item]) => `
        <div class="breakdown-item">
          <span>${id}. ${item.title}</span>
          <strong>${item.earned} / ${item.possible}</strong>
        </div>`).join("");

      const review = document.getElementById("reviewPanel");
      if (!incorrect.length) {
        review.innerHTML = `<div class="review-item" style="background:var(--green-soft); border-color:#b5ddc7;"><h4>全部答對！</h4><p>你已正確運用本單元的字彙、位置描述與 some-/any- 文法。</p></div>`;
      } else {
        review.innerHTML = incorrect.map(({section, question, index, value}) => `
          <article class="review-item">
            <h4>${section.id}-${index + 1}. ${stripHtml(question.prompt || `圖片 ${index + 1}`)}</h4>
            <p><span class="review-label">你的答案：</span>${escapeHtml(getDisplayUserAnswer(question, value))}</p>
            <p><span class="review-label">正確答案：</span>${escapeHtml(getDisplayAnswer(question))}</p>
            <p class="explanation"><span class="review-label">為什麼：</span>${question.explanation}</p>
          </article>`).join("");
      }
      document.getElementById("resultPanel").classList.add("show");
      review.classList.remove("show");
      document.getElementById("toggleReviewBtn").textContent = "查看錯題解析";
    }

    function stripHtml(html) {
      const div = document.createElement("div");
      div.innerHTML = html;
      return div.textContent || div.innerText || "";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function lockQuiz(locked) {
      document.querySelectorAll("#quizForm input, #quizForm select").forEach(el => el.disabled = locked);
      document.querySelectorAll(".listen-btn").forEach(el => el.disabled = locked);
      document.getElementById("submitBtn").disabled = locked;
    }

    function retryQuiz() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      document.querySelectorAll("#quizForm input[type='radio']").forEach(el => el.checked = false);
      document.querySelectorAll("#quizForm input[type='text']").forEach(el => el.value = "");
      document.querySelectorAll("#quizForm select").forEach(el => el.value = "");
      document.querySelectorAll(".question").forEach(el => el.classList.remove("correct", "incorrect", "unanswered"));
      document.querySelectorAll(".listen-status").forEach(el => el.textContent = "尚未播放");
      lockQuiz(false);
      document.getElementById("resultPanel").classList.remove("show");
      document.getElementById("reviewPanel").classList.remove("show");
      clearAlert();
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function saveHistory(total, breakdown) {
      const history = loadHistory();
      history.unshift({
        timestamp: new Date().toISOString(),
        score: total,
        percentage: total,
        sections: Object.fromEntries(Object.entries(breakdown).map(([id, item]) => [id, item.earned]))
      });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 12)));
    }

    function loadHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function renderHistory() {
      const history = loadHistory();
      const target = document.getElementById("historyList");
      if (!history.length) {
        target.innerHTML = `<p class="history-empty">尚無紀錄。第一次送出後，成績會保存在這台裝置的瀏覽器中。</p>`;
        return;
      }
      target.innerHTML = `<div class="history-list">${history.map(item => {
        const date = new Date(item.timestamp);
        const dateText = Number.isNaN(date.getTime()) ? item.timestamp : date.toLocaleString("zh-TW", {
          year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
        });
        return `<div class="history-item"><strong>${item.score} / 100</strong><time>${dateText}</time></div>`;
      }).join("")}</div>`;
    }

    function clearHistory() {
      if (!loadHistory().length) {
        showAlert("目前沒有可清除的歷史紀錄。", "error");
        return;
      }
      if (window.confirm("確定要清除這台瀏覽器中的所有歷史成績嗎？")) {
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
        showAlert("歷史成績已清除。", "success");
      }
    }

    function speak(button) {
      const status = button.parentElement.querySelector(".listen-status");
      if (!("speechSynthesis" in window)) {
        status.textContent = "此瀏覽器不支援語音播放，請改用最新版 Chrome、Edge 或 Safari。";
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(button.dataset.speech);
      utterance.lang = "en-US";
      utterance.rate = 0.86;
      utterance.pitch = 1;
      utterance.onstart = () => {
        status.textContent = "播放中…";
        button.textContent = "🔊 重新播放";
      };
      utterance.onend = () => status.textContent = "播放完畢，可再次播放";
      utterance.onerror = () => status.textContent = "播放失敗，請再按一次或更換瀏覽器。";
      window.speechSynthesis.speak(utterance);
    }

    function validateQuizModel() {
      const entries = allQuestionEntries();
      const totalPoints = entries.reduce((sum, {question}) => sum + question.points, 0);
      const sectionPointsMatch = sections.every(section =>
        section.questions.reduce((sum, question) => sum + question.points, 0) === section.points
      );
      if (entries.length !== 43 || totalPoints !== 100 || !sectionPointsMatch) {
        console.error("Quiz model validation failed", { questions: entries.length, totalPoints, sectionPointsMatch });
      }
    }

    renderQuiz();
    validateQuizModel();
    renderHistory();
    updateProgress();

    document.getElementById("quizForm").addEventListener("change", event => {
      const question = event.target.closest(".question");
      if (question) question.classList.remove("unanswered");
      updateProgress();
    });
    document.getElementById("quizForm").addEventListener("input", event => {
      const question = event.target.closest(".question");
      if (question) question.classList.remove("unanswered");
      updateProgress();
    });
    document.getElementById("quizForm").addEventListener("click", event => {
      const button = event.target.closest(".listen-btn");
      if (button) speak(button);
    });
    document.getElementById("submitBtn").addEventListener("click", submitQuiz);
    document.getElementById("retryBtn").addEventListener("click", retryQuiz);
    document.getElementById("clearHistoryBtn").addEventListener("click", clearHistory);
    document.getElementById("toggleReviewBtn").addEventListener("click", () => {
      const review = document.getElementById("reviewPanel");
      const showing = review.classList.toggle("show");
      document.getElementById("toggleReviewBtn").textContent = showing ? "隱藏錯題解析" : "查看錯題解析";
    });
  </script>
</body>
</html>
