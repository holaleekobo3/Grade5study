          "prompt": "<div class='mini-pic' aria-hidden='true'><svg viewBox='0 0 420 150' role='img'><rect x='8' y='30' width='404' height='100' rx='14' fill='#f8fafc' stroke='#98a2b3'/><rect x='62' y='76' width='95' height='36' rx='5' fill='#fed7aa' stroke='#475467'/><rect x='72' y='58' width='95' height='36' rx='5' fill='#bfdbfe' stroke='#475467'/><rect x='82' y='40' width='95' height='36' rx='5' fill='#e9d5ff' stroke='#475467'/><circle cx='260' cy='68' r='22' fill='#fde68a' stroke='#475467'/><rect x='242' y='90' width='36' height='36' rx='8' fill='#fecaca' stroke='#475467'/><text x='305' y='82' font-size='16'>These books are heavy.</text></svg></div>Ask for help politely. Use <strong>Could you</strong> and <strong>please</strong>.",
          "answer": "Could you help me carry these books, please?",
          "accepted": [
            "could you help me carry these books please",

          "explanation": "Use Could you + base verb + please: Could you help me carry these books, please?"

        {

          "answer": "I would like a new book.",
          "accepted": [
            "i would like a new book",
            "i'd like a new book",
            "i would like to get a new book"
          ],
          "explanation": "Answer with subject + would like + noun: I would like a new book."
        }
      ]
    },
    {
      "id": "F",
      "title": "Part F. Read and Choose",
      "pointsLabel": "2% × 5 = 10%",
      "total": 10,
      "instructions": "Read the passage. For Questions 1–4, choose the best answer. For Question 5, write a complete sentence.",
      "passages": [
        {

          "items": [
            {
              "id": "F1",
              "type": "mcq",
              "points": 2,
              "prompt": "Where did many Maya people live?",
              "options": [
                "In Central America",
                "On the moon",
                "In a cold city in Europe",
                "On a small island"
              ],
              "answer": "In Central America",
              "explanation": "The passage says many Maya people lived in Central America."
            },
            {
              "id": "F2",
              "type": "mcq",
              "points": 2,
              "prompt": "Why were cacao beans special?",
              "options": [
                "People could use them to buy things.",
                "They were easy to find everywhere.",
                "They were made of plastic.",
                "People used them to make kites."
              ],
              "answer": "People could use them to buy things.",
              "explanation": "The passage says people could use cacao beans to buy things."
            },
            {
              "id": "F3",
              "type": "mcq",
              "points": 2,
              "prompt": "What helped farmers know when to plant and harvest cacao?",
              "options": [
                "Stone calendars",
                "Movie tickets",
                "A modern watch",
                "A paper invitation"
              ],
              "answer": "Stone calendars",
              "explanation": "The farmers used stone calendars to know when to plant and harvest cacao."
            },
            {
              "id": "F4",
              "type": "mcq",
              "points": 2,
              "prompt": "What can people buy at a modern market in Guatemala?",
              "options": [
                "Cotton shirts and wool blankets",
                "Snow shoes and ice skates",
                "Only cacao beans",
                "Nothing at all"
              ],
              "answer": "Cotton shirts and wool blankets",
              "explanation": "The passage lists cotton shirts, wool blankets, and wooden masks."
            },
            {
              "id": "F5",
              "type": "text",
              "points": 2,
              "prompt": "Use a complete sentence with <strong>would like to buy</strong>. You want a wool blanket. What would you like to buy?",
              "answer": "I would like to buy a wool blanket.",
              "accepted": [
                "i would like to buy a wool blanket",

    const byId = (id) => document.getElementById(id);
    const quizRoot = byId('quiz');
    const statusBox = byId('status');
    const resultsBox = byId('results');
    const reviewBox = byId('review');

    function allItems() {
      const items = [];
      QUIZ.sections.forEach(section => {
        if (section.items) section.items.forEach(item => items.push({...item, sectionId: section.id, sectionTitle: section.title}));
        if (section.passages) section.passages.forEach(p => p.items.forEach(item => items.push({...item, sectionId: section.id, sectionTitle: section.title})));
      });
      return items;
    }

    function formatScore(n) {
      const rounded = Math.round((n + Number.EPSILON) * 10) / 10;
      return Math.abs(rounded - Math.round(rounded)) < 0.0001 ? String(Math.round(rounded)) : rounded.toFixed(1);
    }

    function normalizeText(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[’‘`]/g, "'")
        .replace(/i\s+would/g, "i would")
        .replace(/i'd/g, "i'd")
        .replace(/can\s*not/g, 'cant')
        .replace(/can't/g, 'cant')
        .replace(/could\s*not/g, 'couldnt')
        .replace(/couldn't/g, 'couldnt')
        .replace(/would\s*not/g, 'wouldnt')
        .replace(/wouldn't/g, 'wouldnt')
        .replace(/[.?!,;:。？！，]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function renderTextItem(item, index) {
      return `<div class="question-card" data-qid="${item.id}">
        <label for="${item.id}"><span class="q-label">${index}.</span>${item.prompt}</label><br>
        <input id="${item.id}" name="${item.id}" type="text" autocomplete="off" aria-label="Answer for ${item.id}">
      </div>`;
    }

    function renderSelectItem(item, index, options) {
      const choices = ['<option value="">請選擇</option>'].concat(options.map((opt, optIndex) => `<option value="${escapeHtml(opt)}">${String.fromCharCode(65 + optIndex)}. ${escapeHtml(opt)}</option>`)).join('');
      return `<div class="question-card" data-qid="${item.id}">
        <label class="blank-line" for="${item.id}"><span class="q-label">${index}.</span><span>${escapeHtml(item.before)}</span>
        <select id="${item.id}" name="${item.id}" aria-label="Answer for ${item.id}">${choices}</select>
        <span>${escapeHtml(item.after)}</span></label>
      </div>`;
    }

    function renderMcqItem(item, index) {
      const options = item.options.map((opt, optIndex) => `
        <label class="option">
          <input type="radio" name="${item.id}" value="${escapeHtml(opt)}" aria-label="${item.id} option ${String.fromCharCode(65 + optIndex)}">
          <span><strong>(${String.fromCharCode(65 + optIndex)})</strong> ${escapeHtml(opt)}</span>
        </label>`).join('');
      return `<div class="question-card" data-qid="${item.id}">
        <p><span class="q-label">${index}.</span>${item.prompt}</p>
        <div class="options" role="radiogroup" aria-label="Question ${item.id}">${options}</div>
      </div>`;
    }

    function renderListening(section) {
      return `<div class="listen-box"><button class="audio" type="button" data-listen="${section.id}">播放聽力</button><button class="secondary" type="button" data-stop-listen>停止播放</button><span class="small">使用瀏覽器內建英文語音；若無聲音，請檢查瀏覽器語音支援。</span></div>`;
    }

    function renderInvitation(section) {
      const chips = section.wordBox.map((w, i) => `<div class="word-chip">${String.fromCharCode(65 + i)}. ${escapeHtml(w)}</div>`).join('');
      return `<div class="word-box">${chips}</div><article class="invitation"><h3>${escapeHtml(section.invitationTitle)}</h3><p><strong>1.</strong> _____,</p><p>${escapeHtml(section.invitationBody).replace(/\n/g, '<br>')}</p></article>`;
    }

    function renderQuiz() {
      let html = '';
      QUIZ.sections.forEach(section => {
        html += `<section id="section-${section.id}"><div class="section-head"><h2>${section.title}</h2><span class="points">${section.pointsLabel}</span></div><p class="instructions">${section.instructions}</p>`;
        if (section.script) html += renderListening(section);
        if (section.wordBox) html += `<div class="word-box">${section.wordBox.map((w, i) => `<div class="word-chip">${String.fromCharCode(65 + i)}. ${escapeHtml(w)}</div>`).join('')}</div><article class="invitation"><h3>${escapeHtml(section.invitationTitle)}</h3><p><strong>1.</strong> _____,</p><p>I am going to have a small music party in the park.<br>It will be <strong>2.</strong> _____ Saturday, July 18th, <strong>3.</strong> _____ 2:30 p.m.<br>Would you <strong>4.</strong> _____? You could <strong>5.</strong> _____ a snack or a drink to share.<br>Please tell me by Friday if you can come.<br>Hope to see you there!<br><strong>6.</strong> _____,<br>Nora</p></article>`;
        if (section.items) {
          section.items.forEach((item, idx) => {
            if (item.type === 'text') html += renderTextItem(item, idx + 1);
            else if (item.type === 'select') html += renderSelectItem(item, idx + 1, section.wordBox);
            else html += renderMcqItem(item, idx + 1);
          });
        }
        if (section.passages) {
          let globalIndex = 1;
          section.passages.forEach(passage => {
            html += `<article class="passage"><h3>${escapeHtml(passage.title)}</h3><p>${escapeHtml(passage.text)}</p></article>`;
            passage.items.forEach(item => {
              if (item.type === 'text') html += renderTextItem(item, globalIndex++);
              else html += renderMcqItem(item, globalIndex++);
            });
          });
        }
        html += '</section>';
      });
      quizRoot.innerHTML = html;
      document.querySelectorAll('[data-listen]').forEach(btn => btn.addEventListener('click', () => playListening(btn.dataset.listen)));
      document.querySelectorAll('[data-stop-listen]').forEach(btn => btn.addEventListener('click', stopListening));
    }

    function playListening(sectionId) {
      const section = QUIZ.sections.find(s => s.id === sectionId);
      if (!section || !section.script) return;
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
        setStatus('這個瀏覽器不支援語音播放，請改用支援 SpeechSynthesis 的瀏覽器。', 'warn');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(section.script);
      utter.lang = 'en-US';
      utter.rate = 0.85;
      utter.pitch = 1;
      utter.onstart = () => setStatus('正在播放聽力。', 'ok');
      utter.onerror = () => setStatus('語音播放失敗，請檢查瀏覽器語音設定。', 'warn');
      utter.onend = () => setStatus('聽力播放完畢，可以開始作答或重播。', 'ok');
      window.speechSynthesis.speak(utter);
    }

    function stopListening() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      setStatus('已停止播放聽力。', 'ok');
    }

    function getAnswer(item) {
      if (item.type === 'mcq') {
        const chosen = document.querySelector(`input[name="${item.id}"]:checked`);
        return chosen ? chosen.value : '';
      }
      const input = byId(item.id);
      return input ? input.value : '';
    }

    function isCorrect(item, answer) {
      if (item.type === 'mcq' || item.type === 'select') return answer === item.answer;
      const normalized = normalizeText(answer);
      return item.accepted.map(normalizeText).includes(normalized);
    }

    function setStatus(message, kind) {
      statusBox.className = `show ${kind}`;
      statusBox.textContent = message;
    }

    function clearStatus() {
      statusBox.className = '';
      statusBox.textContent = '';
    }

    function gradeQuiz() {
      const items = allItems();
      document.querySelectorAll('.question-card').forEach(card => card.classList.remove('missing'));
      const missing = items.filter(item => String(getAnswer(item)).trim() === '');
      if (missing.length) {
        missing.forEach(item => {
          const card = document.querySelector(`[data-qid="${item.id}"]`);
          if (card) card.classList.add('missing');
        });
        setStatus(`還有 ${missing.length} 個作答欄位未完成。請完成黃色標示的題目後再提交。`, 'warn');
        const first = document.querySelector('.question-card.missing');
        if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
        return null;
      }

      let total = 0;
      const sectionScores = Object.fromEntries(QUIZ.sections.map(s => [s.id, {score: 0, max: s.total, title: s.title}]));
      const review = [];
      items.forEach(item => {
        const userAnswer = getAnswer(item);
        const correct = isCorrect(item, userAnswer);
        if (correct) {
          total += item.points;
          sectionScores[item.sectionId].score += item.points;
        } else {
          review.push({...item, userAnswer});
        }
      });
      if (review.length === 0) total = QUIZ.maxScore;
      return { total, sectionScores, review };
    }

    function renderResults(result) {
      const percent = Math.round((result.total / QUIZ.maxScore) * 100);
      const rows = QUIZ.sections.map(s => `<tr><td>${s.id}</td><td>${s.title}</td><td>${formatScore(result.sectionScores[s.id].score)} / ${s.total}</td></tr>`).join('');
      resultsBox.hidden = false;
      resultsBox.innerHTML = `<h2>成績結果</h2><p class="score-big">${formatScore(result.total)} / ${QUIZ.maxScore}</p><p>得分率：${percent}%</p><table class="breakdown"><thead><tr><th>部分</th><th>題型</th><th>分數</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderReview(result) {
      reviewBox.hidden = false;
      if (result.review.length === 0) {
        reviewBox.innerHTML = `<h2>錯題檢討</h2><p><span class="tag ok">全部答對</span> 很好，所有答案都正確。</p>`;
        return;
      }
      const items = result.review.map(item => `
        <div class="review-item">
          <p><span class="tag bad">${item.id}</span> <strong>${item.sectionTitle}</strong></p>
          <p><strong>你的答案：</strong>${escapeHtml(item.userAnswer || '未作答')}</p>
          <p><strong>正確答案：</strong>${escapeHtml(item.answer)}</p>
          <p><strong>提示：</strong>${escapeHtml(item.explanation)}</p>
        </div>`).join('');
      reviewBox.innerHTML = `<h2>錯題檢討</h2><p>以下是需要修正的題目。</p>${items}`;
    }

    function saveHistory(result) {
      const history = JSON.parse(localStorage.getItem(QUIZ.storageKey) || '[]');
      history.unshift({
        date: new Date().toLocaleString('zh-Hant-TW'),
        score: formatScore(result.total),
        max: QUIZ.maxScore,
        sections: Object.fromEntries(Object.entries(result.sectionScores).map(([k, v]) => [k, formatScore(v.score)]))
      });
      localStorage.setItem(QUIZ.storageKey, JSON.stringify(history.slice(0, 10)));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(QUIZ.storageKey) || '[]');
      const target = byId('historyList');
      if (!history.length) {
        target.innerHTML = '<p class="small">目前沒有成績紀錄。</p>';
        return;
      }
      target.innerHTML = `<ol class="history-list">${history.map(h => `<li><strong>${h.score} / ${h.max}</strong>｜${escapeHtml(h.date)}｜A:${h.sections.A} B:${h.sections.B} C:${h.sections.C} D:${h.sections.D} E:${h.sections.E} F:${h.sections.F}</li>`).join('')}</ol>`;
    }

    function resetQuiz() {
      stopListening();
      allItems().forEach(item => {
        if (item.type === 'mcq') document.querySelectorAll(`input[name="${item.id}"]`).forEach(input => input.checked = false);
        else { const input = byId(item.id); if (input) input.value = ''; }
      });
      document.querySelectorAll('.question-card').forEach(card => card.classList.remove('missing'));
      clearStatus();
      resultsBox.hidden = true;
      reviewBox.hidden = true;
      resultsBox.innerHTML = '';
      reviewBox.innerHTML = '';
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function clearHistory() {
      localStorage.removeItem(QUIZ.storageKey);
      renderHistory();
      setStatus('已清除這份測驗的本機成績紀錄。', 'ok');
    }

    byId('submitBtn').addEventListener('click', () => {
      const result = gradeQuiz();
      if (!result) return;
      renderResults(result);
      renderReview(result);
      saveHistory(result);
      setStatus(`已完成批改：${formatScore(result.total)} / ${QUIZ.maxScore}。`, result.total === QUIZ.maxScore ? 'ok' : 'bad');
      resultsBox.scrollIntoView({behavior:'smooth', block:'start'});
    });
    byId('retryBtn').addEventListener('click', resetQuiz);
    byId('clearHistoryBtn').addEventListener('click', clearHistory);

    renderQuiz();
    renderHistory();
  </script>
</body>
</html>
