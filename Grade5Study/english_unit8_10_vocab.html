    const currentTheme = localStorage.getItem('theme') || 'light';

        themeIcon.textContent = '🌙';

            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';

            localStorage.setItem('theme', 'dark');
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark Mode';

    // 2. High-Performance Text-To-Speech (TTS) Engine
    function speak(text) {
        if ('speechSynthesis' in window) {
            // Cancel active utterances to clear queue for instant response
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // Adjusted slightly slower for student comprehension
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('Your browser does not support Speech Synthesis. Please use a modern browser.');
        }
    }

    // 4. Multi-language Real-time Filtering Engine
    searchBox.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filteredData = vocabularyData.filter(item => {
            return item.word.toLowerCase().includes(query) || item.ch.toLowerCase().includes(query);
        });
        renderTable(filteredData);
    });

    // 5. Global Event Delegation for TTS triggers
    vocabTableBody.addEventListener('click', (e) => {
        const targetBtn = e.target.closest('.btn-pronounce');
        if (targetBtn) {
            const targetWord = targetBtn.getAttribute('data-word');
            speak(targetWord);
        }
    });

    // Initial Execution Context initialization
    renderTable(vocabularyData);
</script>

</body>
</html>
